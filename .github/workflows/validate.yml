name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: python -m py_compile workers/python/unilint_worker.py
      - run: node src/cli.mjs compat fixtures/good/basic-project --unity 6000.3 --format json > /tmp/unilint-good.json
      - run: node src/cli.mjs compat fixtures/broken/broken-project --unity 6000.3 --format json > /tmp/unilint-broken.json || test $? -eq 1

  roslyn-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore workers/roslyn/UniLint.Roslyn.csproj
      - run: dotnet build workers/roslyn/UniLint.Roslyn.csproj --configuration Release --no-restore

  real-unity-6000-3-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LuminaryLabs-Dev/NexusWorldFactory
          path: validation/nexus-world-factory
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Analyze real Unity 6000.3 project
        run: |
          set +e
          node src/cli.mjs compat validation/nexus-world-factory/NexusWorldFactory-Stegosaurus-0.0.1/UnityPackagingProject --unity 6000.3 --format json > /tmp/unilint-real-6000.3.json
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
          node --input-type=module -e "
            import fs from 'node:fs';
            const report = JSON.parse(fs.readFileSync('/tmp/unilint-real-6000.3.json', 'utf8'));
            if (!String(report.project.sourceUnity).startsWith('6000.3.')) throw new Error('Expected a real Unity 6000.3 source project.');
            if (report.target.unityLine !== '6000.3') throw new Error('Target line mismatch.');
            if (report.compatibility.runtimeVerified !== false) throw new Error('Static proof must not claim runtime verification.');
            if (!Array.isArray(report.packages) || report.packages.length === 0) throw new Error('Expected package compatibility results.');
            const urp = report.packages.find((pkg) => pkg.name === 'com.unity.render-pipelines.universal' && pkg.resolvedVersion === '17.3.0');
            if (!urp) throw new Error('Expected the real project URP package to be parsed.');
            if (!['compatible','unknown','deprecated','incompatible'].includes(urp.status)) throw new Error('Package state must be explicit.');
          "
